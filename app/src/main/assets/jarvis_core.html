<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin:0; padding:0; background:transparent; overflow:hidden; height:100%; }
  canvas { display:block; }
</style>
</head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
  camera.position.z = 6;

  const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.setClearColor(0x000000, 0);
  document.body.appendChild(renderer.domElement);

  const purple = 0xA855F7;
  const cyan = 0x27E7FF;

  function makeRing(radius, tube, color, opacity) {
    const geo = new THREE.TorusGeometry(radius, tube, 8, 100);
    const mat = new THREE.MeshBasicMaterial({ color: color, transparent: true, opacity: opacity });
    return new THREE.Mesh(geo, mat);
  }

  const ring1 = makeRing(2.2, 0.02, purple, 0.9);
  const ring2 = makeRing(1.9, 0.015, cyan, 0.6);
  ring2.rotation.x = Math.PI / 3;
  const ring3 = makeRing(1.6, 0.01, purple, 0.4);
  ring3.rotation.x = Math.PI / 2.2;
  ring3.rotation.y = Math.PI / 4;

  scene.add(ring1, ring2, ring3);

  const coreGeo = new THREE.SphereGeometry(0.6, 32, 32);
  const coreMat = new THREE.MeshBasicMaterial({ color: cyan });
  const core = new THREE.Mesh(coreGeo, coreMat);
  scene.add(core);

  const glowGeo = new THREE.SphereGeometry(0.9, 32, 32);
  const glowMat = new THREE.MeshBasicMaterial({ color: cyan, transparent: true, opacity: 0.15 });
  const glow = new THREE.Mesh(glowGeo, glowMat);
  scene.add(glow);

  const ambient = new THREE.AmbientLight(0xffffff, 1);
  scene.add(ambient);

  let t = 0;
  function animate() {
    requestAnimationFrame(animate);
    t += 0.01;

    ring1.rotation.z += 0.006;
    ring1.rotation.x += 0.002;
    ring2.rotation.z -= 0.009;
    ring3.rotation.y += 0.004;

    const pulse = 1 + Math.sin(t * 2) * 0.08;
    core.scale.set(pulse, pulse, pulse);
    glow.scale.set(pulse * 1.1, pulse * 1.1, pulse * 1.1);

    renderer.render(scene, camera);
  }
  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
